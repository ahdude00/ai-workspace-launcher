name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore AWL.sln
      - run: dotnet build AWL.sln --no-restore
      - run: dotnet test AWL.sln --no-build --collect "XPlat Code Coverage" --results-directory TestResults
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: hashFiles('tests/python/**') != ''
        with:
          python-version: '3.13'
      - if: hashFiles('tests/python/**') != ''
        run: |
          python -m pip install pytest
          python -m pytest tests/python

  codeql:
    # Dependabot dallarında tarama PR koşusunda yapılır.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/dependabot/')
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build AWL.sln
      - uses: github/codeql-action/analyze@v4
